<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلتفرم ارزیابی دونا | نسخه ۳.۰</title>
<style>
:root{--bg:#f4f1e7;--card:#fffdf6;--ink:#1c2823;--muted:#63716a;--line:#d9d2bd;--acc:#0e6b5c;--acc-soft:#e0efeb;--acc2:#b9822c;--acc2-soft:#f6ecd9;--ok:#2e7d32;--ok-soft:#e3f1e4;--danger:#c0392b;--shadow:0 2px 10px rgba(40,40,20,.08);--radius:14px}
html[data-theme="dark"]{--bg:#101613;--card:#1a221e;--ink:#e6ece8;--muted:#93a49b;--line:#2c3833;--acc:#3cb89c;--acc-soft:#12332c;--acc2:#d9a441;--acc2-soft:#33270f;--ok:#7bc47f;--ok-soft:#16281a;--danger:#e57368;--shadow:0 2px 12px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.9}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:10px 14px}
.h-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto}
.h-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.h-title .logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.h-sub{font-size:11px;color:var(--muted);font-weight:400}
.h-btns{display:flex;flex-wrap:wrap;gap:6px}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px;min-height:40px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
nav{max-width:1100px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
nav button{flex:0 0 auto;border-radius:999px;font-size:12.5px;padding:8px 14px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
nav .pg{font-size:10.5px;opacity:.85;margin-right:4px}
main{max-width:1100px;margin:0 auto;padding:14px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.cat-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.cat-h h2{margin:0;font-size:16.5px}
.cat-note{font-size:12px;color:var(--muted);margin:6px 0 12px}
.prog{font-size:12px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:3px 12px;font-weight:700}
.ind-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.ind-id{font-weight:800;background:var(--acc-soft);color:var(--acc);border-radius:8px;padding:2px 9px;font-size:13px}
.ind-t{font-weight:700;font-size:14.5px;flex:1;min-width:180px}
.badge{font-size:11px;border-radius:999px;padding:3px 10px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--acc2-soft);color:var(--acc2)}.b-red{background:#fdeaea;color:var(--danger)}
.scores{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.scores button{flex:1 1 88px;min-width:64px;display:flex;flex-direction:column;align-items:center;padding:6px 4px;font-size:12px;line-height:1.5;user-select:none}
.scores button b{font-size:15px}
.scores button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.crit{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;min-height:20px}
.crit b{color:var(--ink)}
.frm{margin:8px 0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.frm-t{font-size:12.5px;font-weight:800;color:var(--acc2);margin-bottom:4px}
.frm label{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.frm label:last-child{border-bottom:none}
.frm input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--acc);flex:0 0 auto}
.frm .w{margin-right:auto;font-size:11px;font-weight:800;color:var(--acc2);background:var(--acc2-soft);border-radius:999px;padding:1px 9px;white-space:nowrap}
.frm label.auto{opacity:.75;cursor:not-allowed}
.va{font-size:13px;font-weight:700;background:var(--acc-soft);color:var(--acc);border-radius:10px;padding:7px 10px;margin-top:8px}
.va small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
details.note{margin-top:8px;font-size:12.5px;color:var(--muted)}
details.note summary{cursor:pointer;font-weight:700;color:var(--acc2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label.f{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px}
textarea{min-height:90px}
.info-card{background:var(--acc-soft);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:13px}
.info-card b{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:right}
th{background:var(--bg);font-size:12px}
.twrap{overflow-x:auto}
.toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 20px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
#errbar{display:none;position:fixed;top:0;left:0;right:0;background:#8b1e1e;color:#fff;z-index:120;padding:8px 14px;font-size:12.5px;pointer-events:none}
.navbtns{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
footer{max-width:1100px;margin:0 auto;padding:10px 14px 30px;font-size:11.5px;color:var(--muted)}
#donaSugg{position:absolute;top:100%;right:0;left:0;z-index:60;display:none;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:230px;overflow:auto;margin-top:4px}
#donaSugg button{display:block;width:100%;text-align:right;border:none;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;min-height:40px;font-size:12.5px;padding:6px 10px}
#donaSugg button:last-child{border-bottom:none}
#donaSugg button:hover{background:var(--acc-soft)}
#donaSugg small{display:block;color:var(--muted);font-size:11px}
@media (max-width:600px){body{font-size:14px}.h-title{font-size:14.5px}.scores button{flex:1 1 60px;min-width:56px}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0;padding:10px}.no-print{display:none!important}body{background:#fff}}
</style>

function adjSum(it){if(!it.form)return 0;var f=state.forms[it.id]||[];var s=0;it.form.forEach(function(q,i){if(f[i])s+=q.w;});return Math.round(s*100)/100;}
function absFromOut(o){if(o<12)return 1;if(o<14)return 2;if(o<16)return 3;if(o<18)return 4;return 5;}
function vaFromP(p){if(p<5)return 1;if(p<10)return 2;if(p<15)return 3;if(p<25)return 4;return 5;}
function computeVA(it){
var abs=state.scores[it.id];
if(abs==null)return null;
if(it.type!=="warn")return{abs:abs,adj:0,va:abs,flags:[],p:null};
if(it.special==="52"){var i=parseFloat(state.g52.inn),o=parseFloat(state.g52.out);if(isNaN(i)||isNaN(o)||i<=0)return null;var p=(o-i)/i*100;var va=vaFromP(p);var a2=absFromOut(o);return{abs:a2,adj:va-a2,va:va,flags:["فرمول درصدی شاخص ۵.۲"],p:Math.round(p*10)/10};}
var adj=adjSum(it);var x=abs+adj;var flags=[];
if(x>abs+2){x=abs+2;flags.push("قانون حداکثر فاصله (±۲) اعمال شد");}
if(x<abs-2){x=abs-2;flags.push("قانون حداکثر فاصله (±۲) اعمال شد");}
var va=Math.floor(x+0.5);
if(va>5){va=5;flags.push("سقف ۵ اعمال شد");}
if(va<1){va=1;flags.push("کف ۱ اعمال شد");}
return{abs:abs,adj:adj,va:va,flags:flags,p:null};
}
function catStats(cat){var items=DATA[cat-1].items;var done=0,sum=0;items.forEach(function(it){var r=computeVA(it);if(r){done++;sum+=r.va;}});return{done:done,total:items.length,mean:done?Math.round((sum/done)*100)/100:null};}

function syncInputs(){["name","region","assessor","date","peer"].forEach(function(k){var el=document.getElementById("i_"+k);if(el)el.value=state.info[k]||"";});var t=document.getElementById("i_type");if(t)t.value=state.info.type||"";var e2=document.getElementById("i_escs");if(e2)e2.value=state.info.escs||"";["inn","out"].forEach(function(k){var el=document.getElementById("g_"+k);if(el)el.value=state.g52[k]||"";});["s1","s2","s3","s4"].forEach(function(k){var el=document.getElementById("t_"+k);if(el)el.value=state.texts[k]||"";});}
function exportJson(){
  if (!window.DONA_SCHOOL_CODE) {
    alert("❌ لطفاً ابتدا کد مدرسه را وارد کنید (از جستجو یا تایپ مستقیم).");
    return;
  }
  function toJalali(gDate) {
    if (!gDate) return "";
    var d = new Date(gDate);
    var gy = d.getFullYear(), gm = d.getMonth() + 1, gd = d.getDate();
    var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
    var gy2 = (gm > 2) ? (gy + 1) : gy;
    var days = 355666 + (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100)
             + Math.floor((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
    var jy = -1595 + (33 * Math.floor(days / 12053)); days %= 12053;
    jy += 4 * Math.floor(days / 1461); days %= 1461;
    if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
    var jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
    return jy + "-" + String(jm).padStart(2,"0") + "-" + String(jd).padStart(2,"0");
  }
  var scoresArr = [];
  allItems().forEach(function(it) {
    var abs = state.scores[it.id];
    if (abs == null) return;
    var scoreObj = { code: it.id, absolute: abs };
    if (it.form) {
      var f2 = state.forms[it.id] || [];
      scoreObj.answers = it.form.map(function(q, i) {
        return q.auto ? (clusterOf(state.info.region) === "C") : !!f2[i];
      });
    }
    if (it.special === "52") {
      scoreObj.input_avg = parseFloat(state.g52.inn);
      scoreObj.output_avg = parseFloat(state.g52.out);
    }
    scoresArr.push(scoreObj);
  });
  var out = {
    school_code: window.DONA_SCHOOL_CODE,
    school_name: state.info.name || "",
    district: parseInt(state.info.region) || 0,
    school_type: state.info.type || "",
    visit_date: toJalali(state.info.date),
    academic_year: "",
    auditor: state.info.assessor || "",
    escs: parseInt(state.info.escs) || 0,
    scores: scoresArr,
    evidence: [],
    report: {
      strengths: state.texts.s1 || "",
      weaknesses: state.texts.s2 || "",
      suggestions: state.texts.s3 || "",
      peer_comparison: state.texts.s4 || ""
    }
  };
  var b = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "evaluation-" + (state.info.name || "school") + "-" + window.DONA_SCHOOL_CODE + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("📤 خروجی آماده import در دونا: " + scoresArr.length + " شاخص");
}

// ── بلوک جستجوی مدرسه (v2: داخل تم + پرکن خودکار فیلدها) ──
// نکته: این بلوک باید بعد از renderMain() اجرا شود تا تب‌ها وجود داشته باشند
(function(){
  var grid = document.querySelector('.tab[data-tab="1"] .grid2');
  if (!grid) return;
  var firstCard = grid.closest('.card');

  var wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.style.cssText = 'background:var(--acc-soft);border:1px solid var(--acc)';
  wrap.innerHTML =
    '<div class="cat-h"><h2>🪪 شناسنامه و انتخاب مدرسه</h2><span class="prog" id="donaCodeMsg"></span></div>' +
    '<p class="cat-note">نام مدرسه را تایپ و از لیست انتخاب کنید؛ کد و اطلاعات پایه خودکار تکمیل می‌شوند.</p>' +
    '<div class="grid2">' +
      '<div style="position:relative">' +
        '<label class="f">جستجوی مدرسه</label>' +
        '<input type="text" id="donaSearch" placeholder="مثلاً: روش" autocomplete="off">' +
        '<div id="donaSugg"></div>' +
      '</div>' +
      '<div><label class="f">کد مدرسه (کد ملی ۱۱ رقمی)</label>' +
        '<input type="text" id="donaCode" name="school_code" inputmode="numeric" maxlength="11" placeholder="21408200001"></div>' +
    '</div>';
  firstCard.parentNode.insertBefore(wrap, firstCard);

  var code = document.getElementById('donaCode');
  var msg  = document.getElementById('donaCodeMsg');
  var search = document.getElementById('donaSearch');
  var sugg = document.getElementById('donaSugg');
  var LIST = (typeof SCHOOLS !== "undefined") ? SCHOOLS : [];

  function valid(c){
    if(!/^\d{11}$/.test(c) || c.slice(0,2)!=='21') return false;
    var L=+c[2], D=+c.slice(3,5), G=+c[5], S=+c.slice(6);
    return L>=1&&L<=5 && D>=1&&D<=22 && [1,2,3,9].indexOf(G)>-1 && S>=1&&S<=99999;
  }
  function sync(){
    var c = code.value.trim();
    window.DONA_SCHOOL_CODE = valid(c) ? Number(c) : null;
    msg.textContent = (c==='') ? '' : (window.DONA_SCHOOL_CODE ? '✅ کد معتبر' : '❌ کد نامعتبر');
    try{ localStorage.setItem('dona_school_code', c); }catch(e){}
  }
  function fillFrom(s){
    state.info.name = s.school_name;
    state.info.region = String(s.district_id);
    var t = s.school_type; if (t === 'هیئت امنایی') t = 'هیئت‌امنایی';
    if (t) state.info.type = t;
    syncInputs(); update(); save(true);
  }
  function hide(){ sugg.style.display='none'; sugg.innerHTML=''; }
  function pick(s){
    code.value = String(s.school_code); sync();
    fillFrom(s);
    search.value = s.school_name;
    hide();
    toast('🪪 تکمیل خودکار: ' + s.school_name);
  }
  function showList(q){
    q = (q||'').trim();
    if (!q || !LIST.length) { hide(); return; }
    var hits = LIST.filter(function(s){ return s.school_name.indexOf(q) > -1; }).slice(0,8);
    if (!hits.length) { hide(); return; }
    sugg.innerHTML = hits.map(function(s,i){
      return '<button type="button" data-i="'+i+'"><b>'+s.school_name+'</b><small>منطقه '+s.district_id+' — کد '+s.school_code+'</small></button>';
    }).join('');
    sugg.style.display = 'block';
    sugg.querySelectorAll('button').forEach(function(b){
      b.addEventListener('mousedown', function(ev){ ev.preventDefault(); pick(hits[+b.getAttribute('data-i')]); });
    });
  }
  search.addEventListener('input', function(){ showList(search.value); });
  search.addEventListener('focus', function(){ showList(search.value); });
  document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) hide(); });
  code.addEventListener('input', sync);
  code.addEventListener('change', function(){
    sync();
    if (window.DONA_SCHOOL_CODE) {
      var hit = LIST.find(function(s){ return s.school_code === window.DONA_SCHOOL_CODE; });
      if (hit) { fillFrom(hit); search.value = hit.school_name; }
    }
  });
  try{
    var old = localStorage.getItem('dona_school_code');
    if (old) { code.value = old; sync();
      var h2 = LIST.find(function(s){ return String(s.school_code) === old; });
      if (h2) { fillFrom(h2); search.value = h2.school_name; }
    }
  }catch(e){}
})();
</script>
